[project]
name = "ironsbot"
version = "0.5.1"
description = "赛尔号信息查询机器人"
readme = "README.md"
requires-python = ">=3.10, <4.0"
# The combined bot/image is distributed under GPL-3.0-or-later because it
# includes GPL components. Independently reusable MIT components keep their
# per-file SPDX declarations. See LICENSING.md for details.
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL-3.0", "LICENSING.md"]
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "seerapi>=106.4.0",
    "nonebot2[fastapi,httpx]>=2.4.4",
    "seerapi-models>=106.4.0",
    "nonebot-plugin-htmlkit>=0.1.0rc5",
    "hishel[httpx]>=1.2.1",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-send-anything-anywhere>=0.7.1",
    "nonebot-plugin-localstore>=0.7.4",
    "qrcode-terminal>=0.8",
    "tomli>=2; python_version < '3.11'",
    "unitypy>=1.25.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pygments>=2.20.0",
    "pymdown-extensions>=10.21.3",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = ["bandit", "basedpyright", "pip-audit", "pre-commit", "pytest", "pyyaml", "ruff"]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12" },
]
"@local" = []

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    "FAST", # FastAPI
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "FURB", # refurb
    "TRY",  # tryceratops
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E402",  # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",  # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037", # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string  # Chinese text is intentional
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
# Protocol/vendor-style code kept close to upstream behavior. These files are
# still syntax-checked, import-checked, and compiled, but style-heavy rules that
# would require a risky rewrite are scoped out here instead of hidden globally.
"ironsbot/plugins/headless_seer/**/*.py" = [
    "ANN002",
    "ANN201",
    "B904",
    "BLE001",
    "C901",
    "E501",
    "FBT001",
    "FBT002",
    "PERF401",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "TRY003",
    "TRY301",
]
"ironsbot/integrations/headless_seer/**/*.py" = [
    "ANN002",
    "ANN201",
    "B904",
    "BLE001",
    "C901",
    "E501",
    "FBT001",
    "FBT002",
    "PERF401",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "TRY003",
    "TRY301",
    "TRY400",
]
"ironsbot/plugins/bilibili/auth.py" = [
    "BLE001",
    "FBT001",
    "FBT002",
    "FBT003",
    "PLW0603",
]
"ironsbot/plugins/db_sync/manager.py" = ["BLE001", "PERF203"]
"tests/test_analyze_parser.py" = ["ANN201", "B905", "E501", "PLR2004"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.basedpyright]
# For BasedPyright configurations, see https://docs.basedpyright.com/latest/configuration/config-files/.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "basedpyright>=1.38.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.4.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.2",
]
