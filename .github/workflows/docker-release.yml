name: Publish Docker Image

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Setup Docker
              uses: docker/setup-buildx-action@v2

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install command manifest dependencies
              shell: bash
              run: |
                  python -m pip install --user uv
                  python -m uv sync --frozen --no-install-project

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v2
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Resolve Fork Version
              id: fork_version
              shell: bash
              run: |
                  base_tag="$(tr -d '[:space:]' < __version__)"
                  base_version="${base_tag#v}"

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags origin || true
                  fi

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags https://github.com/Nattsu39/IronsBot.git "refs/tags/${base_tag}:refs/tags/${base_tag}" || true
                  fi

                  if git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    custom_revision="$(git rev-list --count "${base_tag}..HEAD")"
                  else
                    custom_revision="${GITHUB_RUN_NUMBER}"
                    echo "Base tag ${base_tag} not found; using workflow run number ${custom_revision}."
                  fi

                  if [ "${custom_revision}" = "0" ]; then
                    custom_revision="1"
                  fi

                  echo "fork_version=${base_version}.${custom_revision}" >> "$GITHUB_OUTPUT"

            - name: Generate Tags
              uses: docker/metadata-action@v4
              id: metadata
              with:
                  images: |
                      ghcr.io/murmansk5000/ironsbot
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ironsbot
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=${{ steps.fork_version.outputs.fork_version }}
                      type=sha,prefix=sha-
                      type=ref,event=branch
                      type=ref,event=tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}

            - name: Generate poke command promotion manifest
              shell: bash
              env:
                  APP_CONFIG_PATH: config.example.toml
              run: python -m uv run --no-sync python scripts/generate_poke_command_introductions.py

            - name: Build and Publish
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  build-args: |
                      IRONSBOT_PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
