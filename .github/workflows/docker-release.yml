name: Publish Docker Image

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

env:
    PYTHON_VERSION: "3.11"

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Docker
              uses: docker/setup-buildx-action@v4

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install command manifest dependencies
              shell: bash
              run: |
                  python -m pip install --user uv
                  python -m uv sync --frozen --no-install-project

            - name: Audit locked runtime dependencies
              shell: bash
              run: |
                  python -m uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/ironsbot-runtime-requirements.txt" > /dev/null
                  python -m uv tool run --python "$PYTHON_VERSION" --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/ironsbot-runtime-requirements.txt" --require-hashes --disable-pip --strict --progress-spinner off --format json --output "$RUNNER_TEMP/ironsbot-dependency-audit.json"

            - name: Upload dependency audit evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: dependency-audit-${{ github.sha }}
                  path: |
                      ${{ runner.temp }}/ironsbot-runtime-requirements.txt
                      ${{ runner.temp }}/ironsbot-dependency-audit.json
                  if-no-files-found: warn

            - name: Resolve Fork Version
              id: fork_version
              shell: bash
              run: |
                  base_tag="$(tr -d '[:space:]' < __version__)"
                  base_version="${base_tag#v}"

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags origin || true
                  fi

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags https://github.com/Nattsu39/IronsBot.git "refs/tags/${base_tag}:refs/tags/${base_tag}" || true
                  fi

                  if git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    custom_revision="$(git rev-list --count "${base_tag}..HEAD")"
                  else
                    custom_revision="${GITHUB_RUN_NUMBER}"
                    echo "Base tag ${base_tag} not found; using workflow run number ${custom_revision}."
                  fi

                  if [ "${custom_revision}" = "0" ]; then
                    custom_revision="1"
                  fi

                  echo "fork_version=${base_version}.${custom_revision}" >> "$GITHUB_OUTPUT"

            - name: Generate Tags
              uses: docker/metadata-action@v6
              id: metadata
              with:
                  images: |
                      ghcr.io/${{ github.repository }}
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ironsbot
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=${{ steps.fork_version.outputs.fork_version }}
                      type=sha,prefix=sha-
                      type=ref,event=branch
                      type=ref,event=tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}

            - name: Generate poke command promotion manifest
              shell: bash
              env:
                  APP_CONFIG_PATH: config.example.toml
              run: python -m uv run --no-sync python scripts/generate_poke_command_introductions.py

            - name: Build runtime candidate
              id: candidate
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  push: false
                  tags: ironsbot-ci:${{ github.sha }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  build-args: |
                      PYTHON_VERSION=${{ env.PYTHON_VERSION }}
                      IRONSBOT_PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test runtime candidate
              shell: bash
              run: |
                  smoke_config="$RUNNER_TEMP/ironsbot-smoke.toml"
                  sed 's/^check_on_startup = true$/check_on_startup = false/' \
                    config.example.toml > "$smoke_config"
                  docker run --rm --network none \
                    -e EXPECTED_PYTHON_VERSION="$PYTHON_VERSION" \
                    -e APP_CONFIG_PATH=/config/ironsbot.toml \
                    -v "$smoke_config:/config/ironsbot.toml:ro" \
                    "ironsbot-ci:${GITHUB_SHA}" \
                    sh -c '
                      regular="$(fc-match -f "%{file}" "Source Han Sans CN:style=Regular")"
                      bold="$(fc-match -f "%{file}" "Source Han Sans CN:style=Bold")"
                      test -f "$regular"
                      test -f "$bold"
                      test "$regular" != "$bold"
                      actual_python="$(python -c "import sys; print(sys.version_info.major, sys.version_info.minor, sep=chr(46))")"
                      test "$actual_python" = "$EXPECTED_PYTHON_VERSION"
                      python -c "from ironsbot.config.loader import load_settings; import nonebot, seerapi_models; load_settings()"
                    '

            - name: Enforce runtime candidate size budgets
              shell: bash
              env:
                  MAX_APP_KIB: "8192"
                  MAX_SITE_PACKAGES_KIB: "131072"
                  MAX_FONTS_KIB: "24576"
              run: |
                  inventory="$RUNNER_TEMP/ironsbot-candidate-runtime-size-kib.txt"
                  docker run --rm --network none --entrypoint sh \
                    "ironsbot-ci:${GITHUB_SHA}" \
                    -c 'du -sk /app; du -sk /usr/local/lib/python*/site-packages; du -sk /usr/share/fonts' \
                    | tee "$inventory"
                  app_kib="$(awk '$2 == "/app" {sum += $1} END {print sum + 0}' "$inventory")"
                  site_packages_kib="$(awk '$2 ~ /\/site-packages$/ {sum += $1} END {print sum + 0}' "$inventory")"
                  fonts_kib="$(awk '$2 == "/usr/share/fonts" {sum += $1} END {print sum + 0}' "$inventory")"
                  test "$app_kib" -le "$MAX_APP_KIB" || { echo "application payload exceeds ${MAX_APP_KIB} KiB: ${app_kib} KiB" >&2; exit 1; }
                  test "$site_packages_kib" -le "$MAX_SITE_PACKAGES_KIB" || { echo "runtime dependencies exceed ${MAX_SITE_PACKAGES_KIB} KiB: ${site_packages_kib} KiB" >&2; exit 1; }
                  test "$fonts_kib" -le "$MAX_FONTS_KIB" || { echo "font payload exceeds ${MAX_FONTS_KIB} KiB: ${fonts_kib} KiB" >&2; exit 1; }

            - name: Upload candidate size evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: candidate-size-${{ github.sha }}
                  path: ${{ runner.temp }}/ironsbot-candidate-runtime-size-kib.txt
                  if-no-files-found: warn

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Compare runtime candidate image growth
              shell: bash
              env:
                  BASELINE_IMAGE: ghcr.io/${{ github.repository }}:latest
                  MAX_IMAGE_GROWTH_KIB: "8192"
              run: |
                  : "${BASELINE_IMAGE:?missing baseline image}"
                  : "${MAX_IMAGE_GROWTH_KIB:?missing image growth budget}"
                  baseline_image="${BASELINE_IMAGE,,}"
                  candidate="ironsbot-ci:${GITHUB_SHA}"
                  evidence="$RUNNER_TEMP/ironsbot-candidate-image-growth.txt"
                  candidate_bytes="$(docker image inspect "$candidate" --format '{{.Size}}')"
                  {
                    echo "candidate=$candidate"
                    echo "candidate_bytes=$candidate_bytes"
                    echo "baseline=$baseline_image"
                    echo "max_growth_kib=$MAX_IMAGE_GROWTH_KIB"
                  } > "$evidence"
                  docker pull "$baseline_image"
                  baseline_digest="$(docker image inspect "$baseline_image" --format '{{index .RepoDigests 0}}')"
                  baseline_bytes="$(docker image inspect "$baseline_image" --format '{{.Size}}')"
                  growth_bytes="$((candidate_bytes - baseline_bytes))"
                  growth_kib="$((growth_bytes / 1024))"
                  {
                    echo "baseline_digest=$baseline_digest"
                    echo "baseline_bytes=$baseline_bytes"
                    echo "growth_bytes=$growth_bytes"
                    echo "growth_kib=$growth_kib"
                  } >> "$evidence"
                  test "$growth_bytes" -le "$((MAX_IMAGE_GROWTH_KIB * 1024))" || {
                    echo "runtime image grew ${growth_kib} KiB; limit is ${MAX_IMAGE_GROWTH_KIB} KiB" >&2
                    exit 1
                  }

            - name: Upload candidate image growth evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: candidate-image-growth-${{ github.sha }}
                  path: ${{ runner.temp }}/ironsbot-candidate-image-growth.txt
                  if-no-files-found: error

            - name: Build and Publish
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  build-args: |
                      PYTHON_VERSION=${{ env.PYTHON_VERSION }}
                      IRONSBOT_PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha

            - name: Record published image size
              shell: bash
              env:
                  IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  : "${IMAGE_TAGS:?missing published image tags}"
                  : "${IMAGE_DIGEST:?missing published image digest}"
                  IFS= read -r tag <<< "$IMAGE_TAGS"
                  image="${tag%:*}@${IMAGE_DIGEST}"
                  docker pull "$image"
                  docker image inspect "$image" > "$RUNNER_TEMP/ironsbot-image-inspect.json"
                  docker image history --no-trunc --human=false --format '{{json .}}' "$image" > "$RUNNER_TEMP/ironsbot-image-history.jsonl"
                  docker run --rm --network none --entrypoint sh "$image" -c 'du -k -d 1 /app /usr/local/lib/python*/site-packages /usr/share/fonts' > "$RUNNER_TEMP/ironsbot-runtime-size-kib.txt"
                  bytes="$(docker image inspect "$image" --format '{{.Size}}')"
                  mib="$(python -c 'import sys; print(f"{int(sys.argv[1]) / 1024 / 1024:.1f}")' "$bytes")"
                  {
                    echo '## Docker image size'
                    echo
                    echo "- Image: \`$image\`"
                    echo "- Docker-reported image size: **${mib} MiB** (${bytes} bytes)"
                    echo
                    echo 'Layer details are retained in the image-size artifact.'
                    echo 'Runtime directory sizes (KiB) are also retained for code, dependencies and fonts.'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload image size evidence
              uses: actions/upload-artifact@v7
              with:
                  name: image-size-${{ github.sha }}
                  path: |
                      ${{ runner.temp }}/ironsbot-image-inspect.json
                      ${{ runner.temp }}/ironsbot-image-history.jsonl
                      ${{ runner.temp }}/ironsbot-runtime-size-kib.txt
                  if-no-files-found: error
