name: Check Upstream Updates

on:
    schedule:
        # 04:30 Asia/Shanghai every day
        - cron: "30 20 * * *"
    workflow_dispatch:

jobs:
    check-upstream:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/Nattsu39/IronsBot.git
                  git fetch upstream main

            - name: Report upstream changes
              shell: bash
              run: |
                  set -euo pipefail

                  local_count="$(git rev-list --count upstream/main..HEAD)"
                  upstream_count="$(git rev-list --count HEAD..upstream/main)"

                  {
                    echo "## Upstream intake report"
                    echo
                    echo "- Local commits not in upstream: ${local_count}"
                    echo "- Upstream commits not in local branch: ${upstream_count}"
                    echo
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "${upstream_count}" = "0" ]; then
                    echo "No upstream changes need review." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  {
                    echo "### Upstream commits to review"
                    echo
                    git log --oneline --decorate HEAD..upstream/main
                    echo
                    echo "### Changed files"
                    echo
                    git diff --name-status HEAD..upstream/main
                    echo
                    echo "### Intake policy"
                    echo
                    echo "Do not merge upstream/main directly. Classify each change and port it through this repository's current architecture:"
                    echo
                    echo "- data or alias changes: move to the data/alias database pipeline"
                    echo "- small bug fixes: manually port or cherry-pick with review"
                    echo "- Seer query/rendering changes: update the vendor boundary or service layer"
                    echo "- upstream structural refactors: ignore unless they fix a concrete bug here"
                  } >> "$GITHUB_STEP_SUMMARY"
