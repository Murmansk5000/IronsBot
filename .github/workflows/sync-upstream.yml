name: Sync Upstream and Publish

on:
    schedule:
        # 04:30 Asia/Shanghai every day
        - cron: "30 20 * * *"
    workflow_dispatch:

jobs:
    sync-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout fork
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Merge upstream
              id: sync
              run: |
                  git remote add upstream https://github.com/Nattsu39/IronsBot.git
                  git fetch upstream main

                  before="$(git rev-parse HEAD)"
                  upstream="$(git rev-parse upstream/main)"
                  echo "before=${before}" >> "$GITHUB_OUTPUT"
                  echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"

                  if git merge-base --is-ancestor upstream/main HEAD; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "Fork already contains upstream/main."
                    exit 0
                  fi

                  git merge --no-edit upstream/main
                  git push origin main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/setup-qemu-action@v3

            - name: Setup Docker
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Resolve Fork Version
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              id: fork_version
              shell: bash
              run: |
                  base_tag="$(tr -d '[:space:]' < __version__)"
                  base_version="${base_tag#v}"

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags origin || true
                  fi

                  if ! git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    git fetch --tags upstream "refs/tags/${base_tag}:refs/tags/${base_tag}" || true
                  fi

                  if git rev-parse -q --verify "refs/tags/${base_tag}" >/dev/null; then
                    custom_revision="$(git rev-list --count "${base_tag}..HEAD")"
                  else
                    custom_revision="${GITHUB_RUN_NUMBER}"
                    echo "Base tag ${base_tag} not found; using workflow run number ${custom_revision}."
                  fi

                  if [ "${custom_revision}" = "0" ]; then
                    custom_revision="1"
                  fi

                  echo "fork_version=${base_version}.${custom_revision}" >> "$GITHUB_OUTPUT"

            - name: Generate Tags
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/metadata-action@v5
              id: metadata
              with:
                  images: |
                      ghcr.io/murmansk5000/ironsbot
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ironsbot
                  tags: |
                      type=raw,value=latest
                      type=raw,value=${{ steps.fork_version.outputs.fork_version }}
                      type=sha,prefix=sha-
                      type=ref,event=branch

            - name: Build and Publish
              if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
