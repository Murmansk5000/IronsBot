name: Delete Old Docker Hub Tags

on:
    workflow_dispatch:

jobs:
    delete-tags:
        runs-on: ubuntu-latest

        steps:
            - name: Delete old Docker Hub tags
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  token="$(
                    curl -fsSL \
                      -H "Content-Type: application/json" \
                      -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
                      https://hub.docker.com/v2/users/login/ \
                    | python -c "import json,sys; print(json.load(sys.stdin)['token'])"
                  )"

                  for tag in \
                    sha-67a5dc4 \
                    sha-7ea56e7 \
                    sha-b8ef7a8 \
                    sha-6408543 \
                    sha-9f8c00d \
                    master \
                    sha-5de6c45 \
                    sha-fc939ed
                  do
                    echo "Deleting ${tag}"
                    status="$(
                      curl -sS -o /tmp/dockerhub-delete-response.txt -w "%{http_code}" \
                        -X DELETE \
                        -H "Authorization: JWT ${token}" \
                        "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/ironsbot/tags/${tag}/"
                    )"

                    if [ "${status}" = "204" ]; then
                      echo "Deleted ${tag}"
                    elif [ "${status}" = "404" ]; then
                      echo "${tag} already absent"
                    else
                      cat /tmp/dockerhub-delete-response.txt
                      echo "Failed to delete ${tag}: HTTP ${status}" >&2
                      exit 1
                    fi
                  done
