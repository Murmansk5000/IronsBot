name: Update Docker Hub Description

env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

on:
    push:
        branches:
            - main
        paths:
            - "docker/README.md"
            - ".github/workflows/dockerhub-description.yml"
    workflow_dispatch:

jobs:
    dockerhub-description:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Skip unavailable Docker Hub publication
              if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
              run: echo "Docker Hub credentials are not configured; description publication is skipped."

            - name: Update Docker Hub Description
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
              uses: peter-evans/dockerhub-description@v5
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}
                  repository: ${{ env.DOCKERHUB_USERNAME }}/ironsbot
                  short-description: Custom IronsBot image with QQ bot plugins and Unraid templates.
                  readme-filepath: ./docker/README.md
