# 原版固定图片口令的可选配置片段，不是完整运行配置。
# 合入已有 [messaging.sendpic]，不要重复声明该表。
# 将原版五张 PNG 放入 local_root；容器内路径示例为 /app/data/sendpic。
[messaging.sendpic]
local_root = "data/sendpic"

