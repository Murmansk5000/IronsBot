default_at_users = []
# Default: 20; EN: Team subscription query timeout seconds. ZH: 战队订阅查询超时秒数。
query_timeout_seconds = 20
# Default: built-in line; EN: Resource notice status line. ZH: 战队资源提醒状态行。
resource_line = "查到了战队 {team_name}（{team_id}）资源是 {resource}，低于阈值 {threshold}。"
# Default: built-in message; EN: Resource notice extra message. ZH: 战队资源提醒附加文案。
resource_message = "出来买资源，别逼我求你😡"

# EN: QQ commands in enabled groups:
#   战队                 -> query all subscribed teams in this group.
#   战队订阅             -> list current group subscriptions.
