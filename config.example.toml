refresh_interval_seconds = 0.5
# Default: "data/seer/player_query_cache.sqlite"
# EN: Local rank SQLite path.
# ZH: 本地样本榜数据库。
path = "data/seer/player_query_cache.sqlite"

[seer.team_resource]
# Default: true; EN: Enable subscribed team query and resource notices. ZH: 启用战队订阅查询与资源提醒。
enabled = true
# Default: []; EN: Daily low-resource scan times. Empty disables scheduled notices.
# ZH: 每日资源扫描时间；为空时不定时提醒，只保留群内“战队”订阅查询。
times = []
# Default: ["战队"]; EN: Subscribed team query commands. ZH: 本群订阅战队查询口令。
commands = ["战队"]
# Default: 1000; EN: Default low-resource threshold for new QQ-managed subscriptions.
# ZH: 群里新增订阅时的默认资源阈值；命令里可追加数字覆盖。
default_threshold = 1000
# Default: []; EN: Default users to mention when the subscription command has no @.
