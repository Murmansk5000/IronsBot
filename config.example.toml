# SPDX-License-Identifier: MIT
# IronsBot behavior config example.
# Copy to config.dev.toml or /config/ironsbot.toml and edit behavior values here.
# Keep secrets and credentials in environment variables, not in this file.
# See README.md "Feature 对照表" for every feature key and its meaning.
#
# 快速阅读顺序：
# 1. [feature.group_aliases] / [feature.user_aliases]
#    先给群号、QQ 号起短名字，后面策略里都用这些短名字。
# 2. [feature.group_policy] / [feature.user_policy]
#    决定每个群、每个私聊用户能使用哪些功能。
# 3. [bilibili]、[message]、[seer.*]、[runtime.*]
#    分别配置 B 站推送、固定文本/退订/红包提醒、赛尔查询、运行时同步/日志/重启等行为。
#
# 常用 feature key：
# - seer：开启全部赛尔查询子功能。
# - seer_pet / seer_mintmark / seer_player / seer_rank / seer_autocard：
#   只开放精灵、刻印、米米号、榜单、群星牌等单项赛尔功能。
# - image：图片发送；rank：旧榜单帮助入口；meeting：会议回复。
# - bili_query / bili_push：B 站动态查询 / 推送。
# - web_activity_link / web_activity_push：游戏外签到链接查询 / 定时提醒。
# - seer_activity_query / seer_activity_push：游戏内活动结束提醒查询 / 推送。
# - server_status_query / server_status_push：开服状态查询 / 开服推送。
# - ai_chat / ai_intent：AI聊天 / AI意图分析。
# - fire_manual_ad：火火手册广告追加和手册链接意图。
# - team_audit：战队审核群入群提示；team_resource_subscription：战队资源订阅。
# - admin_notice：管理通知目标权限。注意：all 不包含 admin_notice，要单独写。

[feature]
# Default: true
# EN: Let NoneBot superusers bypass feature restrictions.
# ZH: 是否允许超级管理员绕过功能策略限制。
# Example: false
superuser_bypass = true

[feature.group_aliases]
# Default: empty table
# EN: Named QQ group IDs used by policies.
# ZH: 群别名，把易读名称映射到 QQ 群号。
# Example:
# main = 987654321

[feature.user_aliases]
# Default: empty table
# EN: Named QQ user IDs used by policies.
# ZH: 用户别名，把易读名称映射到 QQ 号。
# Example:
# owner = 1234567890

[feature.group_policy]
# Default: empty table
# EN: Group feature allowlist. Feature aliases include all, query, seer, bili,
# seer_activity, server_status, text, text_push, and message. Seer sub-features:
# seer_player, seer_team, seer_pet, seer_mintmark, seer_equipment, seer_type,
# seer_peak, seer_autocard, seer_rank, seer_data.
# ZH: 群功能策略，控制每个群可用哪些功能。seer 是全部赛尔查询总别名；
# 也可只开放 seer_pet、seer_mintmark、seer_player 等子功能。
# 如果某个群不想开放精灵/刻印这类宽泛匹配功能，就不要写 seer，
# 改写 seer_player、seer_rank、seer_autocard 等精细子功能。
# 游戏内每周活动使用 seer_activity_query / seer_activity_push；
# 游戏外活动链接使用 web_activity_link / web_activity_push。
# fire_manual_ad 控制“手册”AI 意图识别和主动推送末尾的火火手册链接。
# team_resource_subscription 控制战队订阅查询和低资源定时提醒。
# admin_notice 不包含在 all 里；管理群要收启动、异常等管理通知时需要显式写 admin_notice。
# 具体推送项可在 TD 菜单里分别退订。
# 超级管理员是否绕过这些限制，由 [feature].superuser_bypass 控制。
# Example:
# example = ["seer_pet", "seer_mintmark", "seer_autocard", "team_resource_subscription"]

[feature.user_policy]
# Default: empty table
# EN: Private/user feature allowlist.
# ZH: 私聊/用户功能策略，也用于私聊推送目标。
# Example:
# owner = ["all"]

[ai]
# Default: "https://api.deepseek.com"
# EN: OpenAI-compatible AI API base URL.
# ZH: OpenAI 兼容 AI 接口地址。
# Example: "https://api.openai.com/v1"
base_url = "https://api.deepseek.com"

# Default: "deepseek-v4-pro"
# EN: AI chat model name.
# ZH: AI 聊天模型名称。
# Example: "deepseek-chat"
model = "deepseek-v4-pro"

# Default: built-in IronsBot prompt.
# EN: System prompt used for AI chat.
# ZH: AI 聊天系统提示词。
# Example: "You are IronsBot."
prompt = "你是 IronsBot，一个接入 QQ 群的赛尔号信息查询机器人。回答应简洁、友好、诚实；无法确认时直接说明不确定，不要编造。"

# Default: 6
# EN: Recent chat turns kept in context.
# ZH: 保留在短期上下文中的聊天轮数。
# Example: 8
history_turns = 6

# Default: true
# EN: Enable persistent AI memory.
# ZH: 是否启用 AI 长期记忆。
# Example: false
memory = true

# Default: "data/ai_chat/memory.sqlite"
# EN: SQLite path for AI memory.
# ZH: AI 记忆 SQLite 路径。
# Example: "data/ai/memory.sqlite"
memory_path = "data/ai_chat/memory.sqlite"

# Default: 8
# EN: Memory turns loaded into context.
# ZH: 加载进上下文的长期记忆轮数。
# Example: 10
memory_turns = 8

# Default: 1200
# EN: Max characters loaded from memory.
# ZH: 长期记忆最大字符数。
# Example: 1500
memory_max_chars = 1200

# Default: 45.0
# EN: AI API timeout in seconds.
# ZH: AI 接口超时时间，单位秒。
# Example: 60.0
timeout = 45.0

# Default: 800
# EN: Maximum output tokens.
# ZH: 最大输出 token 数。
# Example: 1000
max_tokens = 800

# Default: 0.7
# EN: Sampling temperature.
# ZH: 采样温度。
# Example: 0.5
temperature = 0.7

# Default: false
# EN: Enable provider-specific thinking mode.
# ZH: 是否启用供应商特定的思考模式。
# Example: true
thinking = false

# Default: false
# EN: Send a processing notice before AI replies.
# ZH: AI 回复前是否发送“处理中”提示。
# Example: true
waiting_notice = false

# Default: 1500
# EN: Maximum AI reply characters.
# ZH: AI 回复最大字符数。
# Example: 1200
max_reply_chars = 1500

# Default: 60.0
# EN: Mention-guard rate limit window in seconds.
# ZH: 未开启 AI 群 @ 提示的限流窗口秒数。
# Example: 60.0
mention_guard_reply_window_seconds = 60.0

# Default: 10
# EN: Max mention-guard replies per window.
# ZH: 每个窗口最多发送多少次 @ 提示。
# Example: 5
mention_guard_reply_max_per_window = 10

# Default: 600.0
# EN: Admin notice cooldown for AI failures.
# ZH: AI 异常通知管理员的冷却秒数。
# Example: 300.0
admin_notice_cooldown_seconds = 600.0

# Default: true
# EN: Enable AI intent actions.
# ZH: 是否启用 AI 意图动作。
# Example: false
intent_actions_enabled = true

# EN: Intent actions are configured by ID under [ai.intent_actions.<id>].
# Omitted fields inherit built-in defaults for known actions.
# ZH: AI 意图动作按 [ai.intent_actions.<id>] 配置；已知动作未写字段会继承内置默认值。

[ai.intent_actions.join_team]
# Default: true; EN: Enable team recommendation intent. ZH: 是否启用战队推荐意图。
enabled = true

[ai.intent_actions.fire_manual_ad]
# Default: true; EN: Enable Fire manual intent. ZH: 是否启用火火手册意图。
enabled = true

[bilibili]
# B 站配置分三层：
# 1. [bilibili.accounts] 是账号别名库，只负责把名字映射到 UID，不代表一定推送。
# 2. [bilibili.push].accounts 是默认推送账号，所有开启 bili_push 的群/用户都会收到。
# 3. [bilibili.push.groups.<群别名>].accounts 是该群额外追加的账号。
# 推送形式默认由 [bilibili.push].mode 决定，单个账号可用 modes 改成 full/link。
# 群主/管理员可以用“B站推送模式”临时覆盖当前群已订阅账号的推送形式。
# Default: 300.0
# EN: Cooldown for Bilibili login QR notices.
# ZH: B 站登录二维码提醒冷却秒数。
# Example: 600.0
login_notice_cooldown_seconds = 300.0

[bilibili.accounts]
# Default: { seer = 1310714247 }
# EN: Named Bilibili account library. Other Bilibili config references these names.
# ZH: B 站账号别名库，其他 B 站配置均引用这些别名。
# Example: fire = 375750254
seer = 1310714247

[bilibili.storage]
# Default: "data/bilibili_monitor"
# EN: Directory for Bilibili history and cookie state.
# ZH: B 站历史与 Cookie 状态目录。
# Example: "data/bili"
data_dir = "data/bilibili_monitor"

# Default: 1000
# EN: Max dynamic history items retained.
# ZH: 动态历史最多保留条数。
# Example: 2000
history_max_items = 1000

[bilibili.polling]
# Default: 30
# EN: Default polling interval in minutes.
# ZH: 默认轮询间隔分钟数。
# Example: 20
default_minutes = 30

# Default: [{ start = "07:00", end = "23:00", minutes = 5 }]
# EN: Time windows with custom polling interval.
# ZH: 分时轮询窗口。
# Example: [{ start = "07:00", end = "23:00", minutes = 5 }]
windows = [{ start = "07:00", end = "23:00", minutes = 5 }]

[bilibili.push]
# Default: "link"
# EN: Default push mode for accounts without an explicit mode.
# ZH: 未单独指定模式的账号默认推送方式，可选 full 或 link。
# Example: "full"
mode = "link"

# Default: ["seer"]
# EN: Accounts pushed to every group/private target that enables bili_push.
# ZH: 所有开启 bili_push 的群/私聊默认推送的账号。
# Example: ["seer"]
accounts = ["seer"]

# Default: { seer = "full" }
# EN: Global per-account push modes. Runtime admin overrides take priority.
# ZH: 全局按账号指定推送模式；管理员在群内设置的运行时覆盖优先级更高。
# Example: { seer = "full", fire = "link" }
modes = { seer = "full" }

# EN: Group owners/admins can override one account at runtime with:
#     B站推送模式 <账号别名> <内容|链接|默认>
# ZH: 群主/管理员可在群内运行时修改某个账号的推送模式：
#     B站推送模式 <账号别名> <内容|链接|默认>

# Default: {}
# EN: Group push targets keyed by feature group alias or group ID.
# ZH: 群推送目标，键可以是群别名或群号。
# Example: { main = { accounts = ["fire"], modes = { fire = "full" } } }
groups = {}

# Default: {}
# EN: Private push targets keyed by user alias or user ID.
# ZH: 私聊推送目标，键可以是用户别名或 QQ 号。
# Example: { owner = { accounts = ["fire"], mode = "link" } }
users = {}

[bilibili.filters]
# Default: built-in lottery/result suppression patterns.
# EN: Regex patterns that suppress automatic pushes.
# ZH: 抑制自动推送的正则表达式。
# Example: ["恭喜", "中奖", "抽奖结果"]
suppress_push_patterns = ["恭喜", "恭喜.*获得", "记得及时查看私信通知", "中奖", "抽奖结果"]

[activity]
# Default: true
# EN: Enable activity reminders.
# ZH: 是否启用活动结束提醒。
# Example: false
enabled = true

# Default: [11, 1]
# EN: Lead hours for ending reminders.
# ZH: 活动结束前提前多少小时提醒。
# Example: [24, 1]
lead_hours = [11, 1]

# Default: 15
# EN: Grace minutes for missed reminder scheduling.
# ZH: 错过计划提醒时间后的补发宽限分钟。
# Example: 10
grace_minutes = 15

# Default: true
# EN: Only include activities marked as visible.
# ZH: 是否只读取活动中心展示的活动。
# Example: true
only_shown = true

# Default: "data/activity_reminder/sent.sqlite"
# EN: SQLite path recording sent reminders.
# ZH: 已发送活动提醒记录数据库。
# Example: "data/activity/sent.sqlite"
cache_path = "data/activity_reminder/sent.sqlite"

# Default: built-in reminder template.
# EN: Reminder message template.
# ZH: 活动提醒消息模板。
# Available fields: {lead_hours}, {activity_count}, {activity_list}
message = "⏰ 本周活动将在约 {lead_hours} 小时后结束\n{activity_list}"

# Default: 8.0
# EN: Timeout for fetching official activity notices.
# ZH: 获取官方活动公告的超时秒数。
# Example: 10.0
notice_timeout_seconds = 8.0

[message]
# Default: []
# EN: Private fixed command replies.
# ZH: 私聊固定文本回复动作。
# Example action fields: id, enabled, feature, message, commands.
private_commands = []

# Default: []
# EN: Private scheduled messages.
# ZH: 私聊定时文本动作。
# Example action fields: id, name, enabled, feature, message, hour, minute, day_of_week.
# `name` is shown in TD/unsubscribe menus; if omitted, the first message line is used.
private_schedules = []

# Default: []
# EN: Group fixed command replies.
# ZH: 群聊固定文本回复动作。
# Example action fields: id, enabled, feature, message, commands, at_user_ids.
group_commands = []

# Default: []
# EN: Group scheduled messages.
# ZH: 群聊定时文本动作。
# Example action fields: id, name, enabled, feature, message, hour, minute,
# day_of_week, at_user_ids.
# `name` is shown in TD/unsubscribe menus; if omitted, the first message line is used.
group_schedules = []

[message.push_unsubscribe]
# Default: ["td", "退订"]
# EN: Commands that open the unsubscribe menu. Matching is case-insensitive.
# ZH: 打开退订菜单的口令；大小写不敏感，所以 TD 自动生效。
# Built-in push categories include startup_notice, startup_docker_update,
# startup_data_sync, ai_chat_error_notice, bili_login_notice,
# headless_seer_notice, render_crash_notice, red_packet_notice, admin_notice,
# per-account Bilibili dynamic pushes, seer_activity_push, and server_status_push.
# 内置推送项包括机器人启动、启动镜像检查、启动数据同步、AI 聊天异常、
# B站登录、无头赛尔号、精灵渲染崩溃、红包提醒、其它管理通知、
# 按账号拆分的 B站动态、活动结束提醒和开服推送。
commands = ["td", "退订"]
# Default: ["订阅", "恢复订阅"]
# EN: Commands that restore unsubscribed pushes.
# ZH: 恢复已退订推送的口令。
restore_commands = ["订阅", "恢复订阅"]
# Default: "data/messaging/push_unsubscriptions.sqlite"
# EN: SQLite path for push unsubscribe records.
# ZH: 推送退订记录 SQLite 路径。
data_path = "data/messaging/push_unsubscriptions.sqlite"
# Default: built-in hint.
# EN: Hint appended to private pushes.
# ZH: 追加到私聊推送末尾的退订提示。
hint = "回复 TD 可管理推送订阅。"
# Default: built-in group hint.
# EN: Hint appended to group pushes.
# ZH: 追加到群推送末尾的退订提示。
group_hint = "群主/管理员发送 TD 或 订阅可管理本群推送订阅。"

[message.red_packet_notice]
# Default: true
# EN: Notify superusers privately when a QQ group red packet is detected.
# ZH: 检测到 QQ 群红包时，私聊通知超级管理员；不会领取红包。
enabled = true
# Default: 60.0
# EN: Per-group cooldown seconds to avoid repeated red packet notices.
# ZH: 同一个群红包提醒的冷却秒数，避免连续刷屏。
cooldown_seconds = 60.0

[message.outbound_rate_limit]
# Default: true
# EN: Limit outgoing bot messages in non-admin groups.
# ZH: 限制非管理群中的机器人出站消息频率。
enabled = true
# Default: 60.0
# EN: Sliding window seconds.
# ZH: 限流滑动窗口秒数。
window_seconds = 60.0
# Default: 10
# EN: Max outgoing messages per window in non-admin groups.
# ZH: 非管理群每个窗口最多发送多少条机器人消息。
max_messages = 10
# Default: built-in cooldown notice.
# EN: Notice sent after the last allowed message enters cooldown.
# ZH: 发送最后一条允许消息后追加的冷却提示。
cooldown_message = "本群消息发送过于频繁，机器人进入冷却时间，请稍后再试。"

[message.meeting]
# Default: ""
# EN: Tencent meeting number.
# ZH: 腾讯会议号。
# Example: "1234567890"
number = ""

# Default: built-in Tencent meeting template.
# EN: Reply template. Variables: meeting_number, meeting_url.
# ZH: 会议回复模板，可用变量 meeting_number、meeting_url。
# Example: "会议号：{meeting_number}\n{meeting_url}"
template = "腾讯会议\n腾讯会议号：{meeting_number}\n点击链接直接加入：{meeting_url}"

# Default: ["开播", "会议"]
# EN: Meeting trigger commands.
# ZH: 会议回复触发口令。
# Example: ["会议"]
commands = ["开播", "会议"]

[message.team_audit_welcome]
# Default: false
# EN: Enable join guidance in team audit groups.
# ZH: 启用战队审核群新人入群提示。
enabled = false

# Default: "team_audit"
# EN: Feature gate checked for team audit welcome messages.
# ZH: 战队审核入群提示使用的功能权限名。
feature = "team_audit"

# Default: []
# EN: Target groups by group alias or QQ group number.
# ZH: 战队审核入群提示生效群，可填写群别名或群号。
# Example: ["audit_group"]
groups = []

# Default: built-in team audit guidance.
# EN: Welcome message sent to newcomers. The bot will mention the newcomer first.
# ZH: 发送给新人的战队审核说明；机器人会先 @ 新人。
message = "欢迎加入战队审核群。\n如果想加入战队，请先发送“米米号+你的米米号”查询个人信息，方便管理员审核。\n审核通过后，管理员会指引你加入主群和战队；入队完成后请退出审核群。\n如果已经加入主群，或者不想加入战队，请退出本审核群。"

# Default: true
# EN: Remind newcomers again if they are still in the audit group after the delay.
# ZH: 新人入群超过指定时间仍在审核群时，再提醒一次。
followup_enabled = true

# Default: 24.0
# EN: Hours after joining before sending the follow-up reminder.
# ZH: 入群后多少小时发送二次提醒。
followup_after_hours = 24.0

# Default: built-in follow-up reminder.
# EN: Follow-up message. Available placeholders: {hours}, {group_id}, {user_id}.
# ZH: 二次提醒文案；可用占位符：{hours}、{group_id}、{user_id}；机器人会先 @ 新人。
followup_message = "你加入战队审核群已经 {hours:g} 小时了，还没有发送审核信息。\n如果想加入战队，请发送“米米号+你的米米号”供管理员审核；如果已经加入主群，或者不想加入战队，请退出本审核群。"

# Default: "data/team_audit_welcome/pending.sqlite"
# EN: SQLite path used to persist pending 24-hour reminders across restarts.
# ZH: 保存待发送二次提醒的 SQLite 路径，防止机器人重启后丢失提醒。
followup_cache_path = "data/team_audit_welcome/pending.sqlite"

[message.sendpic]
# Default: null/omitted
# EN: CNB repository for configured image backend. Token stays in env.
# ZH: CNB 图床仓库；token 留在环境变量中。
# Example: "org/repo"
cnb_repo = ""

# Default: "sendpic"
# EN: Local image backend root.
# ZH: 本地图床根目录。
# Example: "data/sendpic"
local_root = "sendpic"

# Default: []
# EN: Dynamic sendpic configs. Fields: id, backend, command, aliases, image_dir,
# image_filename_template, help_message, message_template.
# ZH: 可配置发图命令。字段同上。
configs = []

# Default: []
# EN: Enabled dynamic sendpic config IDs.
# ZH: 启用的可配置发图 ID。
# Example: ["meme"]
enabled_ids = []

[seer.player]
# Default: 60
# EN: Successful player-query cooldown seconds.
# ZH: 玩家查询成功后的冷却秒数。
rate_limit_seconds = 60
# Default: 10; EN: Failed player-query cooldown seconds. ZH: 玩家查询失败冷却秒数。
failure_rate_limit_seconds = 10
# Default: 30.0; EN: Player query timeout seconds. ZH: 玩家查询超时秒数。
timeout_seconds = 30.0
# Default: 90.0; EN: Player detail timeout seconds. ZH: 玩家详情查询超时秒数。
detail_timeout_seconds = 90.0
# Default: all player sections; EN: Enabled player sections.
# ZH: 玩家展示区块；可填 basic/collection/rank/autocard/local_rank/peak 等，all 表示全部。
sections = ["all"]

[seer.team]
# Default: 60; EN: Successful team-query cooldown seconds. ZH: 战队查询成功冷却秒数。
rate_limit_seconds = 60
# Default: 10; EN: Failed team-query cooldown seconds. ZH: 战队查询失败冷却秒数。
failure_rate_limit_seconds = 10
# Default: 20.0; EN: Team query timeout seconds. ZH: 战队查询超时秒数。
timeout_seconds = 20.0
# Default: ["basic", "resource"]; EN: Enabled team sections. ZH: 战队展示区块。
sections = ["basic", "resource"]

[seer.mintmark]
# Default: true
# EN: Merge connected mintmarks by hiding connected child entries in query choices.
# ZH: 查询刻印时合并显示连接刻印；设为 false 可显示被连接的子刻印。
merge_connected = true

[seer.rank]
# 这里有三种“范围”不要混：
# - limit：已知分数时，二分查找最多认为前多少名是可搜索范围。
# - online_limit：不知道分数时，在线从前往后扫的最大范围。
# - page_refresh.target_limit：后台定时预热缓存到前多少名，见 [seer.rank.page_refresh]。
# Default: 10000
# EN: Score-known binary rank lookup limit.
# ZH: 已知分数时允许二分查找的最大榜单范围。
limit = 10000
# Default: 2000
# EN: Score-unknown linear online scan limit.
# ZH: 未知分数时允许从前往后线性扫描的在线查询范围。
online_limit = 2000
# Default: 100; EN: Rank page size. ZH: 榜单分页大小。
page_size = 100
# Default: true; EN: Enable rank page cache. ZH: 启用榜单分页缓存。
page_cache = true
# Default: 3600; EN: Rank page cache TTL seconds. ZH: 榜单分页缓存 TTL。
page_cache_ttl_seconds = 3600
# Default: true; EN: Allow stale rank cache. ZH: 允许使用过期缓存。
allow_stale_cache = true
# Default: true; EN: Refresh stale rank cache. ZH: 刷新过期缓存。
refresh_stale_cache = true
# Default: 32; EN: Max point probes for score-based binary rank lookup.
score_search_probe_limit = 32
# Default: 5; EN: Max tied-score pages scanned after binary lookup.
score_search_tie_page_limit = 5
# Default: "data/seer/rank_page_cache.sqlite"
# EN: Rank page cache SQLite path.
# ZH: 榜单分页缓存数据库。
page_cache_path = "data/seer/rank_page_cache.sqlite"
# Default: 10
# EN: Default rank rows shown by rank commands when no page/range is specified.
# ZH: 榜单命令未指定页码或范围时，默认显示多少名。
display_limit = 10
# Default: 100
# EN: Maximum allowed rank rows for configured defaults and group owner/admin changes.
# ZH: 榜单默认显示条数的最大阈值，群主/管理员修改时不能超过此值。
max_display_limit = 100
# Default: {}
# EN: Optional per-group display defaults. Keys can be group aliases or QQ group IDs.
# ZH: 可选的按群默认显示条数；键可以写群别名或 QQ 群号。
display_limits = {}
# Default: "data/seer/rank_display_limits.sqlite"
# EN: Runtime group overrides set by group owners/admins.
# ZH: 群主/管理员在群内修改榜单默认显示条数后的持久化 SQLite。
display_limit_path = "data/seer/rank_display_limits.sqlite"
# Default: omitted/null; EN: Override peak subkey. ZH: 覆盖巅峰 subkey。
# peak_subkey = 123

[seer.rank.page_refresh]
# 后台刷榜只用于预热缓存，加快后续查询；不会把玩家计入“样本”。
# 默认使用“带随机抖动的间隔任务”，避免固定整点高频访问。
# 如果 times 非空，则额外按固定时间触发；如果 interval_minutes 为 0，则关闭间隔触发。
# Default: true
# EN: Enable scheduled full-server rank page cache refresh.
# ZH: 启用全服榜单页缓存定时刷新。
enabled = true
# Default: 50000
# EN: Refresh rank pages up to this display rank.
# ZH: 默认逐步缓存到榜单前多少名。
target_limit = 50000
# Default: {}
# EN: Optional per-rank target limits. Keys are global rank names.
# ZH: 可选的按榜单单独设置缓存目标；键写全服榜名称。
target_limits = {}
# Example: target_limits = { "群星牌" = 10000, "成就点数" = 50000 }
# Default: { "群星牌" = 1000 }
# EN: Optional per-rank score cutoffs. For these ranks, refresh pages until the
# first cached page falls below the score; target_limit remains a safety cap.
# ZH: 可选的按榜单分数线停止刷新。比如群星牌默认刷到页面最低分低于 1000 分；
# 想收 0 分以上玩家时改成 { "群星牌" = 1 }。target_limit 仍作为保险上限。
score_cutoffs = { "群星牌" = 1000 }
# EN: Rank-position score is calculated automatically as 1 / sqrt(page_index).
# ZH: 名次位置分数自动按页序号平方根衰减，例如 1-100 为 1，101-200 约 0.707，1901-2000 约 0.224。
# Default: 0.08
# EN: Extra stale-page multiplier strength. Uses ln(1 + overdue_hours).
# ZH: 过期页面倍率强度；按 ln(1 + 过期小时数) 增长，避免极旧页面差距过大。
stale_age_weight = 0.08
# Default: 5.0
# EN: Maximum score multiplier from stale age.
# ZH: 过期时间带来的最大分数倍率，防止极旧页面一直霸占刷新。
stale_age_max_multiplier = 5.0
# Default: 100
# EN: Rank page request size.
# ZH: 每页榜单请求人数。
page_size = 100
# Default: 10
# EN: Maximum rank pages refreshed per scheduled/manual run.
# ZH: 每轮最多刷新多少页，也就是最多多少次榜单请求。
pages_per_run = 3
# Default: 0
# EN: If > 0, each run refreshes a random number of pages between this value and pages_per_run.
# ZH: 如果大于 0，每轮随机刷新 pages_per_run_min 到 pages_per_run 页，避免每轮固定请求数。
pages_per_run_min = 1
# Default: 0
# EN: Interval-based refresh in minutes. 0 disables interval scheduling.
# ZH: 按间隔刷榜，0 表示关闭；例如 10 表示每 10 分钟一轮。
interval_minutes = 15
# Default: 0
# EN: Minute offset for interval scheduling. With interval_minutes=15 and offset=4,
# the bot schedules at :04, :19, :34, :49 before jitter is applied.
# ZH: 间隔刷榜的分钟偏移；例如 interval_minutes=15、offset=4 时，每小时 04/19/34/49 分调度，之后再叠加随机抖动。
interval_offset_minutes = 4
# Default: 0
# EN: Random scheduler delay in seconds. Keeps refresh jobs away from exact clock ticks.
# ZH: 每轮调度额外随机延后秒数，避免总在整点/固定秒触发。
schedule_jitter_seconds = 240
# Default: 0.0
# EN: Seconds to wait between page requests in one refresh run.
# ZH: 同一轮刷榜中，每个榜单页请求之间的固定等待秒数。
request_interval_seconds = 3.0
# Default: 0.0
# EN: Random extra seconds added to each inter-page wait.
# ZH: 每个榜单页请求之间额外增加的随机等待秒数，降低固定频率特征。
request_jitter_seconds = 3.0
# Default: ""; EN: Optional active refresh window start. ZH: 可选的刷榜活跃时间起点。
active_start = "07:30"
# Default: ""; EN: Optional active refresh window end; may cross midnight.
# ZH: 可选的刷榜活跃时间终点；允许跨过午夜，比如 07:30 到 01:30。
active_end = "01:30"
# Default: 01:15 through 04:45 every half hour.
# EN: Additional fixed daily refresh times. Keep empty when interval_minutes is used.
# ZH: 额外的每日固定刷榜时间；使用 interval_minutes 时通常保持为空。
times = []
# Default: collection-related global ranks.
# EN: Global ranks included in scheduled page refresh.
# ZH: 定时刷新的全服榜。
rank_keys = ["图鉴积分", "成就点数", "精灵图鉴", "皮肤图鉴", "套装图鉴", "部件图鉴", "座驾图鉴", "刻印图鉴", "群星牌"]
# Default: 24
# EN: Refresh cached pages older than this many hours after missing/partial pages.
# ZH: 缺失页、部分缺失页补完后，刷新超过多少小时的旧页面。
refresh_stale_after_hours = 336

[seer.season]
# Default: "群星牌赛季"
# EN: Display name for the autocard season countdown.
# ZH: 群星牌赛季倒计时显示名称。
autocard_name = "群星牌赛季"
# Default: omitted/null
# EN: Optional autocard season start time. Database currently does not provide it.
# ZH: 可选的群星牌赛季开始时间；当前数据库暂未收录官方字段。
# autocard_start_time = 2026-06-20T10:00:00+08:00
# Default: omitted/null
# EN: Optional autocard season end time. Fill it to show autocard countdown.
# ZH: 可选的群星牌赛季结束时间；填写后“赛季倒计时”会显示群星牌剩余时间。
# autocard_end_time = 2026-07-17T10:00:00+08:00

[seer.local_rank]
# Default: true; EN: Enable local sample rank. ZH: 启用本地样本榜。
enabled = true
# Default: 5000; EN: Max local players. ZH: 本地样本最大玩家数。
max_players = 5000
# Default: 100; EN: Batch query limit. ZH: 批量查询大小。
batch_limit = 100
# Default: true; EN: Enable scheduled refresh. ZH: 启用定时刷新。
auto_refresh = true
# Default: 3; EN: Refresh hour. ZH: 刷新小时。
refresh_hour = 3
# Default: 30; EN: Refresh minute. ZH: 刷新分钟。
refresh_minute = 30
# Default: 300; EN: Refresh count limit. ZH: 单次刷新数量上限。
refresh_limit = 300
# Default: 24; EN: Refresh entries older than this many hours. ZH: 刷新超过多少小时的样本。
refresh_max_age_hours = 24
# Default: 0.5; EN: Delay between refresh queries. ZH: 刷新请求间隔秒数。
refresh_interval_seconds = 0.5
# Default: "data/seer/player_query_cache.sqlite"
# EN: Local rank SQLite path.
# ZH: 本地样本榜数据库。
path = "data/seer/player_query_cache.sqlite"

[seer.team_resource]
# Default: true; EN: Enable subscribed team query and resource notices. ZH: 启用战队订阅查询与资源提醒。
enabled = true
# Default: []; EN: Daily low-resource scan times. Empty disables scheduled notices.
# ZH: 每日资源扫描时间；为空时不定时提醒，只保留群内“战队”订阅查询。
times = []
# Default: ["战队"]; EN: Subscribed team query commands. ZH: 本群订阅战队查询口令。
commands = ["战队"]
# Default: 20; EN: Team subscription query timeout seconds. ZH: 战队订阅查询超时秒数。
query_timeout_seconds = 20
# Default: built-in line; EN: Resource notice status line. ZH: 战队资源提醒状态行。
resource_line = "查到了战队 {team_name}（{team_id}）资源是 {resource}，低于阈值 {threshold}。"
# Default: built-in message; EN: Resource notice extra message. ZH: 战队资源提醒附加文案。
resource_message = "出来买资源，别逼我求你😡"

# EN: Add one subscription per group/threshold/mention target set.
# ZH: 每个群、阈值、提醒对象组合写一条订阅；同一条订阅可包含多个战队号。
# [[seer.team_resource.subscriptions]]
# group = "example"
# team_ids = [1234567, 2345678]
# threshold = 1000
# at_users = ["owner"]

[seer.render]
# Default: "render_cache"; EN: Render cache directory. ZH: 渲染缓存目录。
cache_dir = "render_cache"
# Default: 200; EN: Render cache max size in MB. ZH: 渲染缓存上限 MB。
cache_max_size_mb = 200

[runtime.data_sync]
# 数据同步分两层：
# - 普通启动/定时同步默认只下载 GitHub Release 里已经构建好的 SQLite。
# - /更新数据 或 startup_trigger_remote_build=true 才会先触发上游 Actions 流水线，再下载新库。
# 如果只是想避免开机慢，改 on_startup=false；如果想开机也强制跑流水线，改 startup_trigger_remote_build=true。
# Default: true; EN: Download existing release SQLite DBs on startup. ZH: 启动时下载现有 release SQLite，并把结果追加到开机通知；设为 false 可关闭。
on_startup = true
# Default: false; EN: Trigger remote build pipeline during startup sync. ZH: 启动同步时先触发远程构建流水线；开启后才近似等同 /更新数据。
startup_trigger_remote_build = false
# Default: true; EN: Enable scheduled DB sync. ZH: 启用定时数据库同步。
interval_enabled = true

[runtime.data_sync.sources.seerapi]
# Default: IronsBot data release URL. EN: SQLite download URL. ZH: SQLite 下载地址。
url = "https://github.com/Murmansk5000/seerapi/releases/download/ironsbot-data-latest/ironsbot-data.sqlite"
# Default: IronsBot data SHA URL. EN: Optional fingerprint URL. ZH: 可选 SHA256 指纹地址。
fingerprint_url = "https://github.com/Murmansk5000/seerapi/releases/download/ironsbot-data-latest/ironsbot-data.sqlite.sha256"
# Default: 60; EN: Sync interval minutes. ZH: 同步间隔分钟。
interval_minutes = 60
# Default: "data/ironsbot-data.sqlite"; EN: Local cache path. ZH: 本地缓存路径。
local_path = "data/ironsbot-data.sqlite"

[runtime.data_sync.sources.seerapi.remote_build]
# Default: false; EN: Trigger GitHub Actions before manual /更新数据. ZH: 手动 /更新数据 前先触发 GitHub Actions 构建。
enabled = true

# EN: Ordered GitHub Actions pipeline executed before downloading this database.
# ZH: 下载该数据库前顺序执行的 GitHub Actions 流水线。
[[runtime.data_sync.sources.seerapi.remote_build.steps]]
name = "update_unity_config"
repository = "Murmansk5000/seer-unity-config-parser"
workflow_id = "schedule.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10

[[runtime.data_sync.sources.seerapi.remote_build.steps]]
name = "sync_config_sources"
repository = "Murmansk5000/config-sources"
workflow_id = "sync-upstream.yml"
ref = "main"
timeout_seconds = 600
poll_interval_seconds = 10

[[runtime.data_sync.sources.seerapi.remote_build.steps]]
name = "build_seer_data"
repository = "Murmansk5000/seer-data"
workflow_id = "main.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10
inputs = { debug_enabled = false }

[[runtime.data_sync.sources.seerapi.remote_build.steps]]
name = "build_ironsbot_data"
repository = "Murmansk5000/seerapi"
workflow_id = "build-ironsbot-data-db.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10

[runtime.data_sync.sources.aliases]
url = "https://github.com/Murmansk5000/IronsBot/releases/download/alias-db-latest/aliases-data.sqlite"
fingerprint_url = "https://github.com/Murmansk5000/IronsBot/releases/download/alias-db-latest/aliases-data.sqlite.sha256"
interval_minutes = 60
local_path = "data/aliases-data.sqlite"

[runtime.headless]
# Default: login server URL; EN: Seer login server source URL. ZH: 赛尔号登录服务器地址来源。
login_server_addr = "https://seer-login-ip.61.com/unity-ip.txt"
# Default: 300; EN: Headless heartbeat seconds. ZH: 无头客户端心跳秒数。
heartbeat_interval = 300.0
# Default: -1; EN: Reconnect attempts, -1 means forever. ZH: 重连次数，-1 表示无限。
reconnect_retries = -1
# Default: 5.0; EN: Initial reconnect delay seconds. ZH: 初始重连延迟秒数。
reconnect_delay = 5.0
# Default: 120.0; EN: Max reconnect delay seconds. ZH: 最大重连延迟秒数。
reconnect_delay_max = 120.0

[runtime.headless_notice]
# Default: true; EN: Send startup login failure notice. ZH: 启动时发送无头登录失败通知。
login_notice = true
# Default: built-in; EN: Startup login failure notice template. ZH: 启动登录失败通知模板。
login_notice_message = "无头米米号登录未成功。\n米米号：{user_id}\n状态：{reason}\n依赖米米号登录的功能可能不可用；请检查账号、MD5密码、网络或赛尔号服务器状态。"
# Default: true; EN: Send online/offline state notices. ZH: 发送在线/离线状态通知。
state_notice = true
# Default: built-in; EN: Offline state notice template. ZH: 掉线通知模板。
state_offline_message = "无头米米号已掉线。\n米米号：{user_id}\n状态：{reason}\n来源：{source}"
# Default: built-in; EN: Online state notice template. ZH: 恢复在线通知模板。
state_online_message = "无头米米号已恢复登录。\n米米号：{user_id}\n来源：{source}"
# Default: "00:01,00:02"; EN: Daily reconnect check times. ZH: 每日重连检查时间。
reconnect_check_times = "00:01,00:02"

[runtime.startup_notice]
# Default: true; EN: Enable startup notice. ZH: 启用启动通知。
enabled = true
# Default: "机器人已开启。"; EN: Startup notice message. ZH: 启动通知文本。
message = "机器人已开启。"
# Default: 0.0; EN: Delay before sending startup notice. ZH: 启动通知延迟秒数。
delay = 0.0

[runtime.server_status]
# Default: false; EN: Broadcast when server is detected open. ZH: 检测开服时是否广播。
broadcast = false
# Default: "赛尔号已经开服了。"; EN: Open broadcast message. ZH: 开服广播文本。
broadcast_message = "赛尔号已经开服了。"
# Default: 1440; EN: Broadcast cooldown minutes. ZH: 开服广播冷却分钟。
broadcast_cooldown_minutes = 1440

[runtime.docker_update]
# Docker 更新也分两层：
# - check_on_startup：容器自然启动时是否先检查镜像。
# - check_on_restart：发送 /重启机器人 或 /更新镜像 时是否先检查镜像。
# 两个开关都依赖 Docker socket；Windows 源码运行建议设为 false。
# Default: true; EN: Check Docker image during natural startup before other startup runtimes. ZH: 自然启动时先检查 Docker 镜像；不需要可改为 false。
check_on_startup = true
# Default: true; EN: Check Docker image before manual restart/update commands. ZH: 手动 /重启机器人、/更新镜像 前先检查 Docker 镜像；不需要可改为 false。
check_on_restart = true
# Default: "murmansk5000/ironsbot:latest"; EN: Image expected for self update. ZH: 自更新目标镜像，仅用于提示和核对。
image = "murmansk5000/ironsbot:latest"
# Default: "ironsbot"; EN: Container name to update; HOST_CONTAINERNAME env wins if present. ZH: 要更新的容器名；如果存在 HOST_CONTAINERNAME 环境变量则优先使用它。
container_name = "ironsbot"
# Default: "/var/run/docker.sock"; EN: Docker Engine socket mounted into the bot container. ZH: 挂载进机器人容器的 Docker Engine socket。
docker_socket_path = "/var/run/docker.sock"
# Default: "containrrr/watchtower:latest"; EN: Temporary updater image used by Docker update checks. ZH: Docker 镜像更新检查使用的一次性更新器镜像。
watchtower_image = "containrrr/watchtower:latest"
# Default: "1.40"; EN: Docker API version passed to Watchtower. ZH: 传给 Watchtower 的 Docker API 版本；Unraid 新版 Docker 需要不低于 1.40。
watchtower_docker_api_version = "1.40"
# Default: 300.0; EN: Docker API timeout seconds. ZH: Docker API 超时时间。
timeout_seconds = 300.0

[runtime.restart]
# Default: false; EN: Enable scheduled bot restart. ZH: 启用定时重启。
enabled = false
# Default: "04:30"; EN: Daily restart times. ZH: 每日重启时间。
times = "04:30"
# Default: 10.0; EN: Grace seconds before signaling. ZH: 发信号前宽限秒数。
grace_seconds = 10.0
# Default: true; EN: Signal parent process when restarting. ZH: 重启时优先结束父进程。
signal_parent = true

[runtime.help]
# Default: []; EN: Plugin names hidden from help. ZH: 帮助菜单隐藏的插件名称。
ignored_plugins = []

[runtime.priority]
# Default: true; EN: Enable superuser priority gate. ZH: 启用超级管理员优先级。
enabled = true
# Default: 300.0; EN: Normal event wait timeout seconds. ZH: 普通用户等待超管处理的超时秒数。
wait_timeout_seconds = 300.0

[runtime.matcher_priority]
# EN: NoneBot matcher priority. Smaller numbers run first.
# ZH: NoneBot 事件匹配优先级，数字越小越先处理；默认每个功能使用唯一优先级，避免同一消息被多个功能重复响应。
help_hint = 0
ai_group_at = -10
ai_mention_guard = -20
server_status = 1
server_status_admin = 2
bilibili = 3
sendpic = 4
seer_player = 10
seer_team = 11
seer_rank = 12
seer_rank_help = 13
seer_autocard = 14
seer_type = 20
seer_equipment = 21
seer_peak = 22
seer_data = 23
team_resource_subscription = 24
help = 30
about = 31
message_commands = 40
ai_intent = 50
meeting = 60
activity = 70
db_sync = 80
team_audit = 90
# EN: Broad fuzzy Seer matchers are intentionally late.
# ZH: 精灵/刻印属于泛匹配，故意放到后面，避免抢“技能石”等固定图片/文本指令。
seer_mintmark = 100
seer_pet = 110
seer_query = 120
ai_chat = 200

[runtime.logging]
# Default: false; EN: Enable rotating file logs. ZH: 启用轮转文件日志。
file_enabled = false
# Default: "logs/ironsbot.log"; EN: File log path. ZH: 文件日志路径；相对路径会落在当前工作目录。Docker 中当前工作目录是 /app，因此默认等价于 /app/logs/ironsbot.log。
file_path = "logs/ironsbot.log"
# Default: "INFO"; EN: Minimum file log level. ZH: 写入文件的最低日志等级，可填 DEBUG、INFO、WARNING、ERROR 等。
file_level = "INFO"
# Default: false; EN: Also write ERROR/CRITICAL logs to a separate file. ZH: 额外写入独立错误日志文件；只包含 ERROR/CRITICAL，便于排查崩溃。
error_file_enabled = false
# Default: "logs/ironsbot.error.log"; EN: Error log file path. ZH: 错误日志路径；完整日志仍写入 logs/ironsbot.log。
error_file_path = "logs/ironsbot.error.log"
# Default: "20 MB"; EN: Rotate log file when it reaches this size. ZH: 单个日志文件达到该大小后轮转。
rotation = "20 MB"
# Default: "14 days"; EN: Keep rotated logs for this duration. ZH: 轮转日志保留时间。
retention = "14 days"
# Default: "zip"; EN: Compress rotated logs. Set to "" or null to disable. ZH: 轮转旧日志压缩格式，设为空或 null 表示不压缩。
compression = "zip"
