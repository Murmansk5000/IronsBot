# Default: true; EN: Send online/offline state notices. ZH: 发送在线/离线状态通知。
state_notice = true
# Default: built-in; EN: Offline state notice template. ZH: 掉线通知模板。
state_offline_message = "无头米米号已掉线。\n米米号：{user_id}\n状态：{reason}\n来源：{source}"
# Default: built-in; EN: Online state notice template. ZH: 恢复在线通知模板。
state_online_message = "无头米米号已恢复登录。\n米米号：{user_id}\n离线时长：{offline_duration}\n来源：{source}"
# Default: "00:05"; EN: Daily reconnect check times. ZH: 每日重连检查时间。
reconnect_check_times = "00:05"

[operations.startup_notice]
# Default: true; EN: Enable startup notice. ZH: 启用启动通知。
enabled = true
# Default: "机器人已开启。"; EN: Startup notice message. ZH: 启动通知文本。
message = "机器人已开启。"
# Default: 0.0; EN: Delay before sending startup notice. ZH: 启动通知延迟秒数。
delay = 0.0

[operations.docker_update]
# Docker 更新也分两层：
# - check_on_startup：容器自然启动时是否先检查镜像。
# - check_on_restart：发送 /重启机器人 或 /更新镜像 时是否先检查镜像。
# 两个开关都依赖 Docker socket；Windows 源码运行建议设为 false。
# Default: true; EN: Check Docker image during natural startup before other startup runtimes. ZH: 自然启动时先检查 Docker 镜像；不需要可改为 false。
check_on_startup = true
# Default: true; EN: Check Docker image before manual restart/update commands. ZH: 手动 /重启机器人、/更新镜像 前先检查 Docker 镜像；不需要可改为 false。
check_on_restart = true
# Default: "murmansk5000/ironsbot:latest"; EN: Image expected for self update. ZH: 自更新目标镜像，仅用于提示和核对。
image = "murmansk5000/ironsbot:latest"
# Default: "ironsbot"; EN: Container name to update. ZH: 要更新的容器名。
container_name = "ironsbot"
# Default: "/var/run/docker.sock"; EN: Docker Engine socket mounted into the bot container. ZH: 挂载进机器人容器的 Docker Engine socket。
docker_socket_path = "/var/run/docker.sock"
# Default: "containrrr/watchtower:latest"; EN: Temporary updater image used by Docker update checks. ZH: Docker 镜像更新检查使用的一次性更新器镜像。
watchtower_image = "containrrr/watchtower:latest"
# Default: "1.40"; EN: Docker API version passed to Watchtower. ZH: 传给 Watchtower 的 Docker API 版本；Unraid 新版 Docker 需要不低于 1.40。
watchtower_docker_api_version = "1.40"
# Default: 300.0; EN: Docker API timeout seconds. ZH: Docker API 超时时间。
timeout_seconds = 300.0

[operations.private_extensions]
# Optional private extension package. The main Unraid/Docker image remains
# murmansk5000/ironsbot:latest; when enabled, startup pulls this package through
# the mounted Docker socket, validates its manifest, and installs it under /app/data.
# Default: false; EN: Enable the private extension package. ZH: 启用私有扩展包。
enabled = false
# Default: "murmansk5000/ironsbot-private:latest"; EN: Private extension package image.
# ZH: 私有扩展包镜像，不是机器人主镜像。
image = "murmansk5000/ironsbot-private:latest"
# Default: "/ironsbot_extensions"; EN: Read-only package directory inside that image.
# ZH: 私有镜像内的只读扩展包目录。
archive_path = "/ironsbot_extensions"
# Default: "data/private_extensions"; EN: Installed package cache under /app/data.
# ZH: 解包后的扩展缓存目录，会保留最后一次校验成功的版本。
data_path = "data/private_extensions"
# Default: 60.0; EN: Startup pull and archive-read timeout seconds.
# ZH: 启动时拉取和读取扩展包的超时秒数；失败不会阻止机器人启动。
timeout_seconds = 60.0

# Private-only values are passed through without public schema knowledge.
[operations.private_extensions.settings.player_lineup]
timeout_seconds = 15.0
cache_path = "data/seer/player_lineup_cache.sqlite"

# Set DOCKER_REGISTRY_USERNAME and DOCKER_REGISTRY_TOKEN as Unraid/Docker
# environment variables when the extension image is private. Do not put those
# registry credentials in TOML. The same credentials are reused for Docker
# image updates and private extension pulls.

[operations.restart]
# Default: false; EN: Enable scheduled bot restart. ZH: 启用定时重启。
enabled = false
# Default: "04:30"; EN: Daily restart times. ZH: 每日重启时间。
times = "04:30"
# Default: 10.0; EN: Grace seconds before signaling. ZH: 发信号前宽限秒数。
grace_seconds = 10.0
# Default: true; EN: Signal parent process when restarting. ZH: 重启时优先结束父进程。
signal_parent = true
