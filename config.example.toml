# EN: Directory for manually maintained config images. It is created automatically
# when missing. Name each file with the pet ID, for example 4923.png. PNG, WEBP,
# JPG, and JPEG are supported.
# ZH: 手动维护的精灵配置图目录；不存在时启动会自动创建。图片文件名写精灵序号，
# 例如 4923.png；支持 PNG、WEBP、JPG、JPEG。
image_dir = "data/pet_configs"

[operations.data_sync]
# 数据同步分两层：
# - 普通启动/定时同步默认只下载 GitHub Release 里已经构建好的 SQLite。
# - /更新数据 会先让 Actions 检查官方/上游是否有变化，有变化才重建；随后下载新库。
# - /强制更新数据 会传 force=true，强制 Actions 重建，用于排查或 parser 修复后重跑。
# 如果只是想避免开机慢，改 on_startup=false；如果想开机也检查远程构建，改 startup_trigger_remote_build=true。
# Default: true; EN: Download existing release SQLite DBs on startup. ZH: 启动时下载现有 release SQLite，并把结果追加到开机通知；设为 false 可关闭。
on_startup = true
# Default: false; EN: Trigger remote build pipeline during startup sync. ZH: 启动同步时先触发远程构建流水线；开启后才近似等同 /更新数据。
startup_trigger_remote_build = false
# Default: true; EN: Enable scheduled DB sync. ZH: 启用定时数据库同步。
interval_enabled = true

[operations.data_sync.sources.seerapi]
# Default: SeerAPI data release URL. EN: SQLite download URL. ZH: SQLite 下载地址。
url = "https://github.com/Murmansk-Seer/seerapi/releases/download/seerapi-data-latest/seerapi-data.sqlite"
# Default: SeerAPI data SHA URL. EN: Optional fingerprint URL. ZH: 可选 SHA256 指纹地址。
fingerprint_url = "https://github.com/Murmansk-Seer/seerapi/releases/download/seerapi-data-latest/seerapi-data.sqlite.sha256"
# Default: 60; EN: Sync interval minutes. ZH: 同步间隔分钟。
interval_minutes = 60
# Default: "data/seerapi-data.sqlite"; EN: Local cache path. ZH: 本地缓存路径。
local_path = "data/seerapi-data.sqlite"

[operations.data_sync.sources.seerapi.remote_build]
# Default: false; EN: Trigger GitHub Actions before manual /更新数据. ZH: 手动 /更新数据 前先触发 GitHub Actions 构建。
# EN: Each step reuses a recent queued/running workflow by default to avoid duplicate builds.
# ZH: 每个步骤默认会复用最近正在排队/运行的同 workflow，避免重复触发导致排队变慢。
enabled = true

[[operations.data_sync.sources.seerapi.remote_build.steps]]
name = "refresh_official_sources"
repository = "Murmansk-Seer/data-update-workflows"
workflow_id = "update.yml"
ref = "main"
timeout_seconds = 3600
poll_interval_seconds = 10
inputs = { force-update-assets = false, force-update-config = false, dispatch-api-data = false }

[[operations.data_sync.sources.seerapi.remote_build.steps]]
name = "refresh_unity_config"
repository = "Murmansk-Seer/seer-unity-config-parser"
workflow_id = "schedule.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10

# EN: Ordered GitHub Actions pipeline executed before downloading this database.
# ZH: 下载该数据库前顺序执行的 GitHub Actions 流水线；各 workflow 会先检查输入是否变化。
[[operations.data_sync.sources.seerapi.remote_build.steps]]
name = "sync_config_sources"
repository = "Murmansk-Seer/config-sources"
workflow_id = "sync-upstream.yml"
ref = "main"
timeout_seconds = 600
poll_interval_seconds = 10
inputs = { force = false }

[[operations.data_sync.sources.seerapi.remote_build.steps]]
name = "build_api_data"
repository = "Murmansk-Seer/api-data"
workflow_id = "main.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10
inputs = { debug_enabled = false, force = false }

[[operations.data_sync.sources.seerapi.remote_build.steps]]
name = "build_ironsbot_data"
repository = "Murmansk-Seer/seerapi"
workflow_id = "build-seerapi-data-db.yml"
ref = "main"
timeout_seconds = 1800
poll_interval_seconds = 10
inputs = { force = false }

[operations.data_sync.sources.aliases]
url = "https://github.com/Murmansk5000/IronsBot/releases/download/alias-db-latest/aliases-data.sqlite"
fingerprint_url = "https://github.com/Murmansk5000/IronsBot/releases/download/alias-db-latest/aliases-data.sqlite.sha256"
interval_minutes = 60
local_path = "data/aliases-data.sqlite"

[operations.headless]
# EN: Connection, heartbeat, timeout, and reconnect parameters for every public
# query worker. Configure worker identities in [[seer.player_accounts]].
# ZH: 所有公共无头查询账号共用的连接、心跳、超时与重连参数；账号身份在
# [[seer.player_accounts]] 中配置。
# Default: login server URL; EN: Seer login server source URL. ZH: 赛尔号登录服务器地址来源。
login_server_addr = "https://seer-login-ip.61.com/unity-ip.txt"
# Default: 300; EN: Headless heartbeat seconds. ZH: 无头客户端心跳秒数。
heartbeat_interval = 300.0
# Default: 20.0; EN: Single game-server request timeout. A timeout reconnects to prevent a late packet from matching the next query. ZH: 单个游戏服务器请求的超时秒数；超时后会重连，避免迟到封包错配到下一次查询。
request_timeout_seconds = 20.0
# Default: -1; EN: Reconnect attempts, -1 means forever. ZH: 重连次数，-1 表示无限。
reconnect_retries = -1
# Default: 5.0; EN: Initial reconnect delay seconds. ZH: 初始重连延迟秒数。
reconnect_delay = 5.0
# Default: 120.0; EN: Max reconnect delay seconds. ZH: 最大重连延迟秒数。
reconnect_delay_max = 120.0
[operations.headless_notice]
# EN: Notices are sent to superusers and admin_notice groups.
# ZH: 这些通知会发送给超级管理员和 admin_notice 管理群。
# Default: true; EN: Send startup login failure notice. ZH: 启动时发送无头登录失败通知。
login_notice = true
