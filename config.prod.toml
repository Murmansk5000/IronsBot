# Production behavior config template. Mount a copy as /config/ironsbot.toml.
# Secrets stay in environment variables.

[feature]
group_aliases = {}
user_aliases = {}
group_policy = {}
user_policy = {}
superuser_bypass = true

[runtime.data_sync]
on_startup = true
startup_trigger_remote_build = false
interval_enabled = true
