networks:
  ironsbot_net:
    driver: bridge

services:
  ironsbot:
    image: murmansk5000/ironsbot:latest
    container_name: ironsbot
    networks:
      - ironsbot_net
    ports:
      - "8085:8080"
    volumes:
      - /mnt/user/appdata/ironsbot/config:/config
      - /mnt/user/appdata/ironsbot/data:/app/data
      - /mnt/user/appdata/ironsbot/logs:/app/logs
      # Optional: enables /重启机器人, /更新镜像, and startup image checks.
      # Mounting this socket gives the container Docker control on the host.
      # Also required when startup pulls a private extension package.
      # - /var/run/docker.sock:/var/run/docker.sock
    dns:
      - 223.5.5.5
      - 119.29.29.29
    env_file:
      - .env.prod
    environment:
      APP_CONFIG_PATH: "/config/ironsbot.toml"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  napcat:
    image: docker.m.daocloud.io/mlikiowa/napcat-docker:latest
    container_name: napcat
    networks:
      - ironsbot_net
    mac_address: 02:42:ac:11:00:02
    ports:
      - "6099:6099"
    env_file:
      - .env.prod
    environment:
      NAPCAT_UID: "99"
      NAPCAT_GID: "100"
      ELECTRON_DISABLE_GPU: "true"
      NAPCAT_REVERSE_WS_POST: "ws://ironsbot:8080/onebot/v11/ws"
    volumes:
      - /mnt/user/appdata/ironsbot/napcat/config:/app/napcat/config
      - /mnt/user/appdata/ironsbot/ntqq:/app/.config/QQ
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
